name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you start a build by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Python for Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java 17 for the Android build tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Cache Android SDK/NDK and build files (makes later builds much faster)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build the APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: cheating-phone-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload the build log if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
